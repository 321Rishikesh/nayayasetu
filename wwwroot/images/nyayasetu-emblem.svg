<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="NyayaSetu Emblem">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2545" />
      <stop offset="50%" stop-color="#133E68" />
      <stop offset="100%" stop-color="#0A1D34" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#F59E0B" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Shield Shape -->
  <path d="M 40,5 L 70,18 C 70,45 58,65 40,75 C 22,65 10,45 10,18 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#goldBorder)" 
        stroke-width="3" 
        filter="url(#goldGlow)" />

  <!-- Inner Gold Inset Line -->
  <path d="M 40,9 L 66,20 C 66,43 55,61 40,70 C 25,61 14,43 14,20 Z" 
        fill="none" 
        stroke="url(#goldBorder)" 
        stroke-width="1" 
        opacity="0.6" />

  <!-- Central Ashoka Wheel / Dharma Chakra circle behind scale -->
  <circle cx="40" cy="38" r="14" fill="none" stroke="#FCD34D" stroke-width="1" stroke-dasharray="2,2" opacity="0.4" />

  <!-- Scales of Justice -->
  <!-- Central Beam -->
  <line x1="40" y1="18" x2="40" y2="58" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <!-- Horizontal Balance Bar -->
  <path d="M 22,28 C 30,26 50,26 58,28" stroke="url(#goldBorder)" stroke-width="3.5" fill="none" stroke-linecap="round" />
  
  <!-- Left Pan Strings & Pan -->
  <line x1="24" y1="28" x2="18" y2="44" stroke="#FCD34D" stroke-width="1.5" />
  <line x1="24" y1="28" x2="30" y2="44" stroke="#FCD34D" stroke-width="1.5" />
  <path d="M 16,44 Q 24,50 32,44 Z" fill="url(#goldBorder)" />

  <!-- Right Pan Strings & Pan -->
  <line x1="56" y1="28" x2="50" y2="44" stroke="#FCD34D" stroke-width="1.5" />
  <line x1="56" y1="28" x2="62" y2="44" stroke="#FCD34D" stroke-width="1.5" />
  <path d="M 48,44 Q 56,50 64,44 Z" fill="url(#goldBorder)" />

  <!-- Pedestal Base -->
  <rect x="29" y="58" width="22" height="4.5" rx="2" fill="url(#goldBorder)" />
  <rect x="33" y="55" width="14" height="3" rx="1.5" fill="#FFFFFF" />

  <!-- Central Pivot Point / Star -->
  <circle cx="40" cy="27" r="3" fill="#FFFFFF" stroke="url(#goldBorder)" stroke-width="1.5" />
</svg>